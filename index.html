<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rara Review Generator — Legal Document Review Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC; --bg2:#F1F5F9; --card:#FFFFFF; --ink:#0F172A; --ink2:#475569; --ink3:#94A3B8;
  --line:#E2E8F0; --line2:#CBD5E1;
  --accent:#6366F1; --accent2:#4F46E5; --accent3:#3730A3; --accent-soft:#EEF2FF; --accent-glow:rgba(99,102,241,.12);
  --green:#059669; --green2:#047857; --green3:#0F172A; --green-soft:#ECFDF5;
  --brass:#6366F1; --brass2:#4F46E5; --brass-soft:#EEF2FF;
  --paper:#F1F5F9; --paper2:#E2E8F0;
  --low:#059669; --lowbg:#ECFDF5; --med:#D97706; --medbg:#FFFBEB; --high:#EF4444; --highbg:#FEF2F2;
  --crit:#DC2626; --critbg:#FEF2F2;
  --bad:#EF4444; --ok:#059669; --warn:#D97706; --r:12px;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 16px -4px rgba(15,23,42,.08);
  --shadow-lg:0 4px 24px -4px rgba(15,23,42,.12);
  --gradient:linear-gradient(135deg,#6366F1 0%,#8B5CF6 50%,#A78BFA 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;color:var(--ink)}
button{font-family:inherit;font-size:13.5px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
a{color:var(--accent)}
svg.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
svg.ic-lg{width:20px;height:20px}
::selection{background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:10px;border:1px solid transparent;font-weight:600;transition:all .2s ease;font-size:13px}
.btn:active{transform:translateY(1px)}
.btn:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn .ic{width:15px;height:15px}
.btn-green{background:var(--accent);color:#fff;border-color:var(--accent2)}
.btn-green:hover{background:var(--accent2);box-shadow:0 4px 12px rgba(99,102,241,.25)}
.btn-brass{background:var(--gradient);color:#fff;border-color:transparent}
.btn-brass:hover{box-shadow:0 4px 14px rgba(99,102,241,.3)}
.btn-ghost{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn-ghost:hover{background:var(--bg2);border-color:var(--line2);color:var(--ink)}
.btn-danger{background:var(--highbg);color:var(--high);border-color:#FECACA}
.btn-danger:hover{background:var(--high);color:#fff}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:8px}
.btn-icon{padding:8px;border-radius:8px}
.btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--ink);color:#CBD5E1;padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px}
.brand-mono{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;background:var(--gradient);box-shadow:0 4px 12px rgba(99,102,241,.3)}
.brand b{font-family:var(--sans);font-size:17px;color:#fff;display:block;line-height:1.15;font-weight:700}
.brand small{font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:#64748B;font-weight:600}
.nav-sec{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:#475569;padding:16px 12px 8px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;color:#94A3B8;border-left:3px solid transparent;margin:2px 0;user-select:none;transition:all .15s ease;font-weight:500;font-size:13.5px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#E2E8F0}
.nav-item.active{background:rgba(99,102,241,.15);color:#A5B4FC;border-left-color:var(--accent);font-weight:600}
.nav-item .badge-n{margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 8px;min-width:22px;text-align:center}
.side-foot{margin-top:auto;padding:16px 10px 4px;font-size:11.5px;color:#475569;border-top:1px solid rgba(255,255,255,.08)}
.side-foot .btn-ghost{color:#94A3B8;border-color:rgba(255,255,255,.15)}
.side-foot .btn-ghost:hover{background:rgba(255,255,255,.06);color:#E2E8F0}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:40}
.topbar h2{font-size:19px;font-weight:700}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.user-chip{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);padding:6px 14px 6px 6px;border-radius:40px;transition:all .15s}
.user-chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.user-chip .av{width:32px;height:32px;border-radius:50%;background:var(--gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.user-chip .nm{font-weight:700;font-size:13px;line-height:1.1}
.user-chip .rl{font-size:10.5px;color:var(--ink3)}
.bell{position:relative}
.bell .n{position:absolute;top:-4px;right:-4px;background:var(--high);color:#fff;font-size:10px;font-weight:700;border-radius:20px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
.content{padding:28px 32px 60px;max-width:1200px;width:100%}
.notif-dd{position:absolute;right:28px;top:60px;width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:60;overflow:hidden}
.notif-dd .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.notif-dd .hd a{font-size:11.5px;font-weight:600;cursor:pointer;color:var(--accent)}
.notif-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:flex-start;transition:background .1s}
.notif-item:hover{background:var(--bg)}
.notif-item.unread{background:var(--accent-soft)}
.notif-item .tt{font-size:10.5px;color:var(--ink3);margin-top:2px}
.notif-empty{padding:24px;text-align:center;color:var(--ink3);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px;transition:box-shadow .2s}
.card h3{font-size:15px;margin-bottom:4px}
.card .sub{color:var(--ink2);font-size:12.5px;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--ink3);font-weight:700;padding:10px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--bg2);vertical-align:middle}
.tbl tr.rowlink{cursor:pointer;transition:background .1s}
.tbl tr.rowlink:hover td{background:var(--accent-soft)}
.tbl .file-cell b{font-weight:600;display:block}
.tbl .file-cell small{color:var(--ink3);font-size:11px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.2px}
.pill .dot{width:6px;height:6px;border-radius:50%}
.p-ok{background:#ECFDF5;color:#059669}.p-ok .dot{background:#059669}
.p-wait{background:#FFFBEB;color:#D97706}.p-wait .dot{background:#D97706}
.p-wait2{background:var(--bg2);color:var(--ink2)}.p-wait2 .dot{background:var(--ink2)}
.p-note{background:var(--accent-soft);color:var(--accent2)}.p-note .dot{background:var(--accent)}
.p-bad{background:var(--highbg);color:var(--high)}.p-bad .dot{background:var(--high)}
.p-ret{background:#FFF7ED;color:#C2410C}.p-ret .dot{background:#F97316}
.p-out{background:var(--high);color:#fff}.p-out .dot{background:#FECACA}
.p-idle{background:var(--bg2);color:var(--ink2)}
.p-must{background:var(--high);color:#fff}
.p-should{background:#FFFBEB;color:#D97706}
.p-nice{background:var(--bg2);color:var(--ink2)}
.sla{font-size:12px;font-weight:600;color:var(--ok)}
.sla.late{color:var(--high)}
.ver-chip{display:inline-block;font-size:10.5px;font-weight:700;border:1px solid var(--line2);border-radius:6px;padding:2px 7px;margin-right:4px;color:var(--ink2);cursor:pointer;transition:all .15s}
.ver-chip.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.ver-chip:hover{border-color:var(--accent);color:var(--accent)}
.riskpill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;padding:3px 11px;border-radius:8px;letter-spacing:.5px;white-space:nowrap;text-transform:uppercase}
.riskpill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.r-crit{background:#FEF2F2;color:#DC2626}.r-high{background:#FEF2F2;color:#EF4444}.r-med{background:#FFFBEB;color:#D97706}.r-low{background:#ECFDF5;color:#059669}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);transition:all .2s;position:relative;overflow:hidden}
.stat:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.stat .num{font-family:var(--sans);font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.stat .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--ink3);font-weight:700;margin-top:4px;display:flex;align-items:center;gap:6px}
.stat.c-crit .num{color:var(--crit)}.stat.c-bad .num{color:var(--high)}.stat.c-warn .num{color:var(--warn)}.stat.c-ok .num{color:var(--ok)}.stat.c-brass .num{color:var(--accent)}
.risk-strip{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.risk-counts{display:flex;gap:24px}
.rc .n{font-family:var(--sans);font-size:30px;font-weight:800;line-height:1;letter-spacing:-.03em}
.rc .l{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700}
.rc.crit .n,.rc.crit .l{color:var(--crit)}.rc.high .n,.rc.high .l{color:var(--high)}.rc.med .n,.rc.med .l{color:var(--med)}.rc.low .n,.rc.low .l{color:var(--low)}
.risk-bar{flex:1;min-width:200px;height:10px;border-radius:8px;overflow:hidden;display:flex;background:var(--bg2)}
.risk-bar div{height:100%}
.b-crit{background:#EF4444}.b-high{background:#F97316}.b-med{background:#F59E0B}.b-low{background:#10B981}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--bg2);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:10px 16px;font-weight:600;font-size:12.5px;color:var(--ink3);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;display:flex;gap:7px;align-items:center;transition:all .15s;border-radius:8px 8px 0 0}
.tab:hover{color:var(--ink);background:var(--bg2)}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent);background:var(--accent-soft)}
.tab .n{font-size:10.5px;background:var(--bg2);border-radius:12px;padding:2px 8px;font-weight:700;color:var(--ink2)}
.tab.active .n{background:var(--accent);color:#fff}
details.pasal{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden;transition:all .2s;box-shadow:var(--shadow)}
details.pasal summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;flex-wrap:wrap;transition:background .1s}
details.pasal summary::-webkit-details-marker{display:none}
details.pasal summary:hover{background:var(--bg)}
.pasal-no{font-family:var(--sans);font-weight:800;font-size:14px;white-space:nowrap;color:var(--accent2)}
.pasal-judul{font-weight:600;font-size:13px;flex:1;min-width:140px}
.pasal-body{padding:4px 18px 18px;border-top:1px solid var(--bg2)}
.pasal-quote{font-style:italic;color:var(--ink2);background:var(--bg);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;white-space:pre-wrap;font-size:12.8px}
.finding{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff;transition:all .15s}
.finding:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.finding .fh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:8px;flex-wrap:wrap}
.finding .sec{margin-top:8px;font-size:12.6px}
.finding .sec .lb{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;font-weight:800;color:var(--ink3);display:block;margin-bottom:2px}
.finding .frisk{color:var(--ink2)}
.finding .fcon{color:var(--high)}
.finding .frec{color:var(--accent2)}
.redline{margin-top:10px;border:1.5px dashed var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:10px;font-size:12.6px;color:var(--accent3)}
.redline .lb{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;font-weight:800;color:var(--accent2);display:block;margin-bottom:3px}
.rev-status{font-size:10px;font-weight:800;padding:3px 9px;border-radius:6px;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
.rs-hold{background:#FFF7ED;color:#C2410C}.rs-resolved{background:#ECFDF5;color:#059669}
.rs-partial{background:#FFFBEB;color:#D97706}.rs-worse{background:#FEF2F2;color:#EF4444}.rs-new{background:#EEF2FF;color:#4F46E5}
.comment{display:flex;gap:11px;padding:14px 0;border-bottom:1px dashed var(--bg2)}
.comment .av{width:34px;height:34px;border-radius:50%;background:var(--bg2);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:none}
.comment.by-rio .av{background:var(--gradient);color:#fff}
.comment .meta{font-size:11.5px;color:var(--ink3);margin-bottom:4px}
.comment .meta b{color:var(--ink);font-size:12.5px}
.comment .txt{font-size:13px;background:var(--bg);border:1px solid var(--line);padding:10px 14px;border-radius:10px}
.warn-box{display:flex;gap:10px;background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;padding:14px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;align-items:flex-start}
.login-wrap{min-height:100vh;display:grid;grid-template-columns:46% 54%}
.login-left{background:var(--ink);color:#CBD5E1;padding:52px 54px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.login-left::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 70%,rgba(99,102,241,.12) 0%,transparent 60%)}
.seal{position:absolute;right:-100px;bottom:-100px;width:400px;height:400px;border:1.5px solid rgba(99,102,241,.2);border-radius:50%}
.seal::before{content:"";position:absolute;inset:30px;border:1px solid rgba(99,102,241,.12);border-radius:50%}
.login-brand{position:relative;z-index:2}
.login-brand .mono{width:74px;height:74px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;background:var(--gradient);box-shadow:0 8px 24px rgba(99,102,241,.35);font-weight:800}
.login-brand h1{color:#fff;font-size:32px;margin-top:22px;line-height:1.15;letter-spacing:-.02em}
.login-brand p{margin-top:12px;max-width:400px;font-size:14px;color:#64748B;line-height:1.6}
.login-feats{margin-top:40px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:2}
.lf{display:flex;gap:14px;align-items:flex-start;font-size:13.5px;color:#94A3B8}
.lf b{color:#E2E8F0;display:block;font-size:13.5px}
.lf .ic{color:var(--accent);margin-top:2px;width:18px;height:18px}
.login-foot{margin-top:auto;position:relative;z-index:2;font-size:11.5px;color:#475569;border-top:1px solid rgba(255,255,255,.08);padding-top:16px}
.login-right{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--bg)}
.login-card{width:100%;max-width:420px}
.login-card h2{font-size:24px;margin-bottom:4px}
.login-card .sub{color:var(--ink2);margin-bottom:24px;font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink2);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;outline:none;transition:all .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.field textarea{resize:vertical;min-height:90px}
.login-err{background:var(--highbg);color:var(--high);border:1px solid #FECACA;padding:12px 14px;border-radius:10px;font-size:12.5px;margin-bottom:16px;display:none}
.demo-box{margin-top:28px;border:1.5px dashed var(--line2);border-radius:12px;padding:16px}
.demo-box .t{font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;display:flex;gap:6px;align-items:center}
.demo-chip{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:12.5px;transition:all .15s;text-align:left}
.demo-chip:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateX(4px)}
.demo-chip b{font-size:12.5px;display:block}
.demo-chip small{color:var(--ink3)}
.dz{border:2px dashed var(--line2);border-radius:14px;background:var(--bg);padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s}
.dz:hover,.dz.drag{border-color:var(--accent);background:var(--accent-soft)}
.dz .ic-lg{width:36px;height:36px;color:var(--accent);margin-bottom:10px}
.dz b{display:block;font-size:13.5px}
.dz small{color:var(--ink3)}
.dz .fname{margin-top:8px;display:inline-block;background:var(--accent-soft);border-radius:8px;padding:5px 14px;font-size:12.5px;color:var(--accent2);font-weight:600}
.demo-pick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.demo-pick button{font-size:11.5px;padding:5px 10px}
.mode-row{display:flex;gap:8px;margin-bottom:12px}
.proc-wrap{max-width:640px;margin:40px auto}
.proc-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:36px 38px;text-align:center}
.proc-card .mono{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;margin:0 auto 16px;background:var(--gradient);box-shadow:0 8px 24px rgba(99,102,241,.3);font-weight:800}
.proc-card h2{font-size:20px}
.proc-card .sub{color:var(--ink2);margin:6px 0 28px}
.steps{text-align:left;margin:0 6px}
.step{display:flex;gap:13px;padding:11px 6px;border-bottom:1px dashed var(--bg2);opacity:.35;transition:.35s}
.step.active,.step.done{opacity:1}
.step .sic{width:32px;height:32px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.step.active .sic{background:var(--accent-soft);color:var(--accent)}
.step.done .sic{background:#ECFDF5;color:var(--ok)}
.step .st{font-weight:700;font-size:13px}
.step .ss{font-size:11.5px;color:var(--ink2)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stamp-zone{margin-top:28px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}

const CDN={
  jszip:['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js','https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'],
  pdfjs:['https://cdnjs.cloudflare.com/ajax/libs/pdfjs-dist/3.11.174/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js']
};
function loadScript(urls){
  return new Promise(function(resolve,reject){
    function tryOne(i){
      if(i>=urls.length){ reject(new Error('Perpustakaan gagal dimuat (periksa koneksi). Gunakan dokumen contoh atau mode Tempel Teks.')); return; }
      var s=document.createElement('script'); s.src=urls[i];
      var to=setTimeout(function(){ s.remove(); tryOne(i+1); },15000);
      s.onload=function(){ clearTimeout(to); resolve(urls[i]); };
      s.onerror=function(){ clearTimeout(to); s.remove(); tryOne(i+1); };
      document.head.appendChild(s);
    }
    tryOne(0);
  });
}
async function extractText(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.docx')){
    if(!window.JSZip)await loadScript(CDN.jszip);
    const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const xml=zip.file('word/document.xml');
    if(!xml)throw new Error('Struktur DOCX tidak dikenali.');
    let t=(await xml.async('string')).replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,' ');
    t=t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/[ \t]{2,}/g,' ').trim();
    if(t.length<200)throw new Error('Teks dokumen terlalu pendek untuk dianalisis.');
    return t;
  }
  if(name.endsWith('.pdf')){
    if(!window.pdfjsLib){ const base=await loadScript(CDN.pdfjs); pdfjsLib.GlobalWorkerOptions.workerSrc=base.replace('pdf.min.js','pdf.worker.min.js'); }
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    let out='';
    for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); out+=tc.items.map(function(it){return it.str;}).join(' ')+'\n'; }
    if(out.replace(/\s/g,'').length<80)throw new Error('PDF tidak mengandung teks (kemungkinan hasil pindaian). Gunakan PDF berbasis teks, DOCX, atau Tempel Teks.');
    return out;
  }
  return await file.text();
}

/* ---------- hari kerja & SLA ---------- */
function addBD(ts,n){ const d=new Date(ts); let a=0; while(a<n){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6)a++; } return d.getTime(); }
function subBD(ts,n){ const d=new Date(ts); while(n>0){ d.setDate(d.getDate()-1); const w=d.getDay(); if(w!==0&&w!==6)n--; } return d.getTime(); }
function bdBetween(a,b){ let c=0; const d=new Date(a); while(d.getTime()<b){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6)c++; if(c>400)break; } return c; }
function nextBiz(ts){ const d=new Date(ts); do{ d.setDate(d.getDate()+1); }while(d.getDay()===0||d.getDay()===6); return d.getTime(); }
function remainTxt(deadline){
  const diff=deadline-now();
  if(diff<=0){ return {late:true, txt:'Terlambat '+bdBetween(deadline,now())+' hari kerja'}; }
  const d=Math.floor(diff/864e5), h=Math.floor(diff%864e5/36e5);
  return {late:false, txt: d>0?d+' hari '+h+' jam tersisa':h+' jam tersisa'};
}

const SYS_PROMPT='Anda adalah AI LEGAL DOCUMENT REVIEW ENGINE yang bekerja sebagai Senior Legal Reviewer, Contract Analyst, dan Legal Risk Analyst. Tugas Anda bukan sekadar membaca dokumen, melainkan melakukan review substantif, struktural, konsistensi, legal risk, commercial risk, dan drafting quality.\n\nTujuan akhir review: mengidentifikasi apa yang salah, apa yang kurang, apa yang berisiko, mengapa berisiko, siapa yang terdampak, dan bagaimana memperbaikinya dalam bahasa hukum yang tepat. Setiap temuan WAJIB merujuk pada isi dokumen yang benar-benar ditemukan — dilarang memberikan review generik atau mengarang isi dokumen.\n\nMETODOLOGI (jalankan berurutan):\nSTEP 1 — DOCUMENT UNDERSTANDING: jenis & judul dokumen, para pihak dan kedudukannya, tujuan, objek/perikatan utama, hak-kewajiban utama, jangka waktu, nilai transaksi, governing law, mekanisme penyelesaian sengketa. Jangan menyimpulkan sebelum memahami struktur dan tujuan dokumen.\nSTEP 2 — CLAUSE-BY-CLAUSE REVIEW: tinjau tiap Pasal/Ayat/ketentuan individual: apa yang diatur; jelas/lengkap atau tidak; ambiguity; potensi multi-interpretasi; risiko hukum dan komersial; ketidakseimbangan hak-kewajiban; potensi sengketa; konsistensi dengan ketentuan lain; perlu diperbaiki atau tidak.\nSTEP 3 — LEGAL RISK ANALYSIS, klasifikasi tiap temuan:\n- critical: kehilangan hak material; kewajiban sangat besar; liability tak terbatas; ketidakabsahan/unenforceability; termination yang merugikan; pembayaran tanpa perlindungan; sengketa serius; exposure hukum/finansial signifikan.\n- high: kerugian material; ketidakjelasan kewajiban; hak salah satu pihak terlalu dominan; mekanisme perlindungan lemah; potensi sengketa signifikan.\n- medium: interpretasi berbeda; posisi hukum melemah; operational issue; dispute di kemudian hari.\n- low: typo, terminology, formatting, cross-reference, ketidakkonsistenan kecil.\nSTEP 4 — PARTY POSITION ANALYSIS: pihak yang dilindungi dinyatakan dalam pesan user. Fokus pada bagaimana ketentuan dapat merugikan pihak tersebut. Jangan memberikan rekomendasi netral bila terdapat kepentingan pihak yang harus dilindungi. Untuk setiap risiko jelaskan apa yang dapat terjadi terhadap posisi user apabila klausul dibiarkan.\nSTEP 5 — INTERNAL CONSISTENCY CHECK: definisi tidak digunakan; istilah digunakan tanpa definisi; tanggal/jangka waktu/nilai pembayaran bertentangan; kewajiban bertentangan; termination bertentangan dengan term; dispute resolution tidak konsisten; cross-reference salah; nomor pasal salah; pihak berubah-ubah; hak-kewajiban tidak sinkron. Bila ada konflik, tampilkan kedua ketentuan yang bertentangan.\nSTEP 6 — MISSING CLAUSE DETECTION: cari ketentuan penting yang TIDAK ada (Definitions, Scope, Rights & Obligations, Payment, Taxes, Representations & Warranties, Confidentiality, Intellectual Property, Data Protection, Compliance, Liability, Indemnification, Force Majeure, Term & Termination, Consequences of Termination, Dispute Resolution, Governing Law, Notices, Assignment, Amendment, Severability, Waiver, Entire Agreement). Jangan menyatakan wajib bila tidak relevan dengan jenis dokumen.\nSTEP 7 — LEGAL POSITION STRESS TEST, skenario relevan: A Default; B Late Performance; C Non-Payment; D Termination; E Dispute; F Force Majeure; G Liability (dibatasi/unlimited); H Change of Circumstances; I Third Party Claim; J Exit.\nSTEP 8 — DRAFTING QUALITY REVIEW: clarity, precision, consistency, enforceability, defined terms, legal terminology, grammar, numbering, cross-reference, ambiguity, excessive discretion, vague obligation, subjective standard. Perhatikan khusus kata: "sewaktu-waktu", "sewajarnya", "secukupnya", "dapat", "dianggap", "segera", "sesuai kebutuhan", "atas kebijakan", "apabila diperlukan", "dan/atau", "reasonable", "material", "best effort". Jelaskan bila kata tersebut membuka ruang interpretasi yang merugikan pihak user.\nSTEP 9 — REDLINE RECOMMENDATION: untuk setiap temuan yang perlu perubahan, jangan hanya bilang "perlu diperbaiki": kutip klausul (existing provision), issue, legal risk, potential consequence, recommended action, dan PROPOSED WORDING berupa redrafting klausul siap pakai dalam bahasa hukum Indonesia yang mempertahankan maksud bisnis sejauh tidak menimbulkan risiko.\nSTEP 10 — RISK PRIORITIZATION: urutkan critical > high > medium > low; bedakan MUST FIX (perbaiki sebelum tanda tangan) / SHOULD FIX (sangat disarankan) / NICE TO FIX (drafting/administrative).\n\nATURAN PENTING: jangan mengarang isi dokumen; jangan menganggap klausul ada bila tidak ditemukan; jangan menyimpulkan hanya dari jenis dokumen; bedakan legal issue / commercial issue / drafting issue; jangan menyatakan ketentuan "ilegal" tanpa dasar memadai; jangan memberikan legal citation yang tidak dapat diverifikasi; jangan hanya mengkritik — selalu beri solusi; jangan mengubah commercial intent tanpa alasan; prioritas perlindungan pada pihak yang direpresentasikan user; bila informasi tidak cukup, nyatakan "Insufficient Information" dan jelaskan informasi yang dibutuhkan; setiap risk harus dapat ditelusuri ke klausul tertentu; gunakan bahasa hukum profesional yang mudah dipahami business user; lakukan juga holistic document analysis, bukan hanya clause-by-clause.\n\nOUTPUT CONTRACT — WAJIB DIPATUHI. Balas HANYA satu objek JSON valid (tanpa markdown, tanpa teks apa pun di luar JSON), seluruh nilai dalam Bahasa Indonesia:\n{"profile":{"type":"","parties":"","purpose":"","term":"","value":"","gov":"","disp":""},\n"overallRisk":"CRITICAL|HIGH|MEDIUM|LOW",\n"position":"Favorable|Balanced|Unfavorable",\n"action":"SAFE TO SIGN|SIGN WITH REVISION|SIGN AFTER MATERIAL REVISION|RENEGOTIATE|DO NOT SIGN",\n"execPoints":["3 sampai 5 risiko terbesar, masing-masing satu kalimat"],\n"lang":[{"type":"Struktur|Tata Bahasa|Konsistensi|Ambiguitas","issue":"","quote":"","sug":""}],\n"pasal":[{"no":1,"judul":"judul pasal dari dokumen","text":"teks lengkap pasal dari dokumen","risk":"critical|high|medium|low","findings":[{"tier":"critical|high|medium function tc(s){ if(!s)return''; const low=['dan','atau','dari','pada','yang','untuk','dengan','ke','di','oleh','sebelum','sesudah']; return s.toLowerCase().split(' ').map(function(w,i){ return i>0&&low.indexOf(w)>=0?w:w.charAt(0).toUpperCase()+w.slice(1); }).join(' '); }
function parseArticles(text){
  const lines=text.split(/\r?\n/); const arts=[]; let cur=null;
  const re=/^\s*(?:pasal)\s+(\d+)\s*[.\-–—:]?\s*(.*)$/i;
  for(const ln of lines){
    const m=ln.match(re);
    if(m){ if(cur)arts.push(cur); cur={no:+m[1],title:m[2].replace(/^[.\-–—:\s]+/,'').trim(),body:[]}; }

  }
  if(cur)arts.push(cur);
  if(!arts.length){
    const paras=text.split(/\n\s*\n/).map(function(p){return p.trim();}).filter(function(p){return p.length>40;}).slice(0,12);
    paras.forEach(function(p,i){ arts.push({no:i+1,title:'',body:[p]}); });
    if(!arts.length)arts.push({no:1,title:'',body:[text]});
  }

}
function pihakContext(text,userPihak){
  const found=[...new Set((text.match(/pihak\s+(pertama|kedua|ketiga|keempat)/gi)||[]).map(function(s){ return s.toLowerCase().replace(/(^\s*\w|[\s]\w)/g,function(c){return c.toUpperCase();}); }))];

}
function sentencesOf(t){ return (t.replace(/\n/g,' ').match(/[^.;]+[.;]*/g)||[]).map(function(s){return s.trim();}).filter(Boolean); }
function firstQuote(body,re){ const ss=sentencesOf(body); for(const s of ss){ if(re.test(s)) return s.length>240?s.slice(0,240)+'…':s; } return ''; }
function bearerOf(text){
  const m=text.match(/(Pihak\s+\w+)\s+(?:\w+\s+){0,3}?(wajib|bertanggung|berkewajiban|dikenakan|membayar)/i);
  if(m)return m[1];
  return null;
}
function holderOf(text){
  const m=text.match(/(Pihak\s+\w+)\s+(?:\w+\s+){0,4}?berhak/i);
  if(m)return m[1];
  return null;
}
function docProfile(text,ctx){
  const head=text.split(/\r?\n/).slice(0,4).join(' ');
  let parties='';
  const pm=head.match(/antara\s+(.+?)\s+selaku\s+(Pihak\s+\w+)\s+dan\s+(.+?)\s+selaku\s+(Pihak\s+\w+)/i);
  if(pm)parties=tc(pm[2])+': '+pm[1].trim()+'  ·  '+tc(pm[4])+': '+pm[3].trim();
  let type='Perjanjian (jenis tidak teridentifikasi)';
  const tl=[[/kerahasiaan|nda|confidential/i,'Perjanjian Kerahasiaan (NDA)'],[/memorandum of understanding|\bmou\b/i,'Memorandum of Understanding (MoU)'],[/distribusi/i,'Perjanjian/MoU Distribusi'],[/sewa/i,'Perjanjian Sewa'],[/pembelian|penjualan/i,'Perjanjian Jual Beli / Pembelian'],[/konsultansi|jasa\s+profesional/i,'Perjanjian Konsultansi / Jasa Profesional'],[/pemeliharaan|maintenance/i,'Perjanjian Jasa Pemeliharaan'],[/kerja\s+sama/i,'Perjanjian Kerja Sama'],[/perjanjian/i,'Perjanjian']];
  for(const t of tl){ if(t[0].test(head)){ type=t[1]; break; } }
  let term='—';
  const tm=text.match(/berlaku[^.;]{0,60}?(\d+)\s*(?:\([^)]{1,25}\)\s*)?(bulan|tahun|hari)/i);
  if(tm)term=tm[1]+' '+tm[2];
  let value='Tidak disebutkan / Insufficient Information';
  const nums=[]; const vr=/Rp\s?([\d.,]+)/g; let vm;
  while((vm=vr.exec(text))!==null){ const n=parseFloat(vm[1].replace(/[.,](?=\d{3})/g,'').replace(/[.,]/g,'.')); if(!isNaN(n))nums.push(n); }
  if(nums.length)value='Rp '+Math.max.apply(null,nums).toLocaleString('id-ID')+' (nilai terbesar yang disebut)';
  const gov=/hukum\s+(yang\s+berlaku\s+)?(Republik\s+)?Indonesia/i.test(text)?'Republik Indonesia':'Tidak disebutkan';
  let disp='Tidak disebutkan';
  if(/arbitrase/i.test(text))disp='Arbitrase (setelah musyawarah)';
  else if(/pengadilan/i.test(text))disp='Pengadilan (setelah musyawarah)';
  else if(/musyawarah/i.test(text))disp='Musyawarah — TANPA forum final';

}
function analyzeDrafting(text){
  const out=[];
  sentencesOf(text).forEach(function(s){ const wc=s.split(/\s+/).length;
    if(wc>32) out.push({type:'Struktur',quote:s.length>200?s.slice(0,200)+'…':s,issue:'Kalimat sangat panjang ('+wc+' kata) — meningkatkan risiko salah tafsir hukum.',sug:'Pecah menjadi 2–3 kalimat pendek.'});
  });
  const typoRe=/\bdi\s+(laksanakan\w*|laksana\w*|tetapkan|tetap\w*|sepakati|tutup|hapus\w*|susun\w*|atur\w*|lapor\w*|kirim\w*|terima\w*|tinjau\w*|cetak\w*|mulai\w*|putus\w*|sahkan\w*|rekam\w*|tanda\s?tangani\w*)\b/gi;
  let m; const seen={};
  while((m=typoRe.exec(text))!==null){ const w=m[0].replace(/\s+/g,'').toLowerCase(); if(!seen[w]){ seen[w]=1;
    out.push({type:'Tata Bahasa',quote:m[0],issue:'Penulisan "'+m[0]+'" seharusnya serangkai sebagai imbuhan di-.',sug:'Gunakan "'+w+'" — prefiks di- ditulis serangkai.'}); } }
  const pC=(text.match(/Pihak\s+Pertama/g)||[]).length, pAny=(text.match(/pihak\s+pertama/gi)||[]).length;
  if(pAny>pC&&pC>0) out.push({type:'Konsistensi',quote:'',issue:'Penulisan "Pihak Pertama" tidak konsisten (kapital vs kecil).',sug:'Konsistenkan kapitalisasi istilah terdefinisi.'});
  return out.slice(0,14);
}

function actionClsOf(a){
  a=String(a||'').toUpperCase();
  if(a.indexOf('DO NOT SIGN')>=0)return 'a-no';
  if(a.indexOf('RENEGOTIATE')>=0)return 'a-rene';
  if(a.indexOf('MATERIAL')>=0)return 'a-mat';
  if(a.indexOf('SAFE TO SIGN')>=0)return 'a-safe';
  return 'a-rev';
}

function reviewDocument(text,meta,prev){
  const arts=parseArticles(text);

  const pasal=[]; let dirScore=0;
  for(const a of arts){
    const findings=[]; const seen={};
    const bearer=bearerOf(a.text), holder=holderOf(a.text);
    const bearerIsUser=bearer===ctx.userPihak, bearerIsOther=ctx.others.indexOf(bearer)>=0;
    const holderIsUser=holder===ctx.userPihak, holderIsOther=ctx.others.indexOf(holder)>=0;
    for(const r of LEGAL_RULES){
      if(!r.re.test(a.text))continue;
      if(seen[r.tag])continue; seen[r.tag]=1;
      let w=r.w, note='';
      if(r.dir==='bearer'&&bearerIsUser)w+=0.8;
      if(r.dir==='bearer'&&bearerIsOther){ w-=1.6; note=' Beban kewajiban saat ini berada pada pihak lawan — kondisi ini menguntungkan posisi Anda; pertahankan namun antisipasi permintaan negosiasi ulang.'; }
      if(r.dir==='holder'&&holderIsUser){ w-=1.2; note=' Hak ini berada di tangan pihak yang Anda wakili — rumutan menguntungkan Anda.'; }
      if(r.dir==='holder'&&holderIsOther){ w+=1.2; note=' Hak ini berada di tangan pihak lawan terhadap posisi Anda.'; }
      const tier=w>=4.4?'critical':w>=2.4?'high':w>=1?'medium':'low';
      findings.push({tag:r.tag,tier:tier,type:r.w<0?'legal (positif)':'legal',title:r.t,quote:firstQuote(a.text,r.re),
        finding:r.f,legalRisk:r.rk,consequence:r.cs+(note?' '+note:''),
        recommendation:r.rec,redline:r.rd,neg:(w>=2.4&&r.np)?{pref:r.np,min:r.nm,lang:r.nl}:null});
    }
    for(const r of WORD_RULES){
      if(!r.re.test(a.text))continue;
      if(seen[r.tag])continue; seen[r.tag]=1;
      findings.push({tag:r.tag,tier:'low',type:'drafting',title:'Kata berisiko: '+r.word,quote:firstQuote(a.text,r.re),
        finding:'Ditemukan '+r.word+' — '+r.why,
        legalRisk:'Isu drafting yang melemahkan posisi hukum bila berhadapan dengan interpretasi yang berlawanan.',
        consequence:'Rumutan ini membuka ruang tafsir pada klausul terkait — masalah kelas NICE TO FIX.',
        recommendation:r.fix,redline:r.rd,neg:null});
    }
    if(holderIsOther&&(bearerIsUser||/\bwajib\b/i.test(a.text)))dirScore+=1.2;
    if(holderIsUser)dirScore-=1;
    let mx='low';
    findings.forEach(function(f){ if(RANKV[f.tier]>RANKV[mx])mx=f.tier; });
    pasal.push({no:a.no,judul:a.judul,text:a.text,risk:mx,findings:findings,status:null,prevRisk:null});
  }
  const conflicts=[];
  const hasPat=function(re){ return pasal.filter(function(p){return re.test(p.text);}); };
  const termP=pasal.filter(function(p){return /berlaku[^.;]{0,60}\d+\s*(bulan|tahun)/i.test(p.text)||/jangka\s+waktu/i.test(p.judul);});
  const liabP=hasPat(/sepanjang\s+waktu|tidak\s+terbatas/i);
  if(termP.length&&liabP.length&&termP[0].no!==liabP[0].no){
    conflicts.push({a:'Pasal '+termP[0].no+' — '+termP[0].judul,b:'Pasal '+liabP[0].no+' — '+liabP[0].judul,
      c:'Kewajiban pada Pasal '+liabP[0].no+' berlaku "sepanjang waktu" sementara jangka perjanjian dibatasi Pasal '+termP[0].no+'.',
      rk:'Kewajiban melampaui jangka perjanjian — kewajiban pasca-kontrak tak diinginkan.',

  const termPasalAll=pasal.filter(function(p){return /(mengakhiri|pengakhiran|terminasi)/i.test(p.text);});
  const termText=termPasalAll.map(function(p){return p.text;}).join(' ');
  while((nm2=nre.exec(termText))!==null){ if(notices.indexOf(+nm2[1])<0)notices.push(+nm2[1]); }
  if(notices.length>=2){
    conflicts.push({a:'Klausul pengakhiran (notice '+Math.min.apply(null,notices)+' hari)',b:'Klausul pengakhiran (notice '+Math.max.apply(null,notices)+' hari)',
      c:'Masa tenggang pengakhiran berbeda untuk masing-masing pihak ('+notices.join(' hari vs ')+' hari) — asimetris.',

  if(dispP.length){
    conflicts.push({a:'Pasal '+dispP[0].no+' — mekanisme sengketa',b:'—',
      c:'Mekanisme sengketa berulang (musyawarah kembali) tanpa tahap final.',
      rk:'Tidak ada kepastian forum akhir.',
      rec:'Tetapkan tenggat musyawarah dan forum final.'});

    const pmap={}; prev.pasal.forEach(function(p){pmap[p.no]=p;});
    const norm=function(s){return s.toLowerCase().replace(/\s+/g,' ').trim();};
    for(const p of pasal){
      const o=pmap[p.no];
      if(!o){ p.status='new'; continue; }

      changed:pasal.filter(function(p){return ['resolved','partial','worse'].indexOf(p.status)>=0;}).length,
      held:pasal.filter(function(p){return p.status==='hold';}).length,

async function reviewWithLLM(text,meta,prev){

  const body={contents:[{role:'user',parts:[{text:userMsg}]}],systemInstruction:{parts:[{text:SYS_PROMPT}]},generationConfig:{temperature:0.2,responseMimeType:'application/json'}};

  if(!txt)throw new Error((cand.finishReason?('Respons kosong ('+cand.finishReason+')'):'Respons model kosong'));

function normAI(o,meta){

      return {tier:fixTier(f.tier),type:f.type||'legal',title:String(f.title||'Temuan'),quote:String(f.quote||''),
        finding:String(f.finding||''),legalRisk:String(f.legalRisk||''),consequence:String(f.consequence||''),
        recommendation:String(f.recommendation||''),redline:String(f.redline||f.recommendation||''),
        neg:(f.neg&&f.neg.pref)?{pref:String(f.neg.pref),min:String(f.neg.min||''),lang:String(f.neg.lang||'')}:null,tag:'llm'};
    });
    let risk=fixTier(p.risk);

    fs.forEach(function(f){ if(RANKV[f.tier]>RANKV[mx])mx=f.tier; });
    if(RANKV[risk]<RANKV[mx])risk=mx;
    const st=String(p.status||'').toLowerCase();

      prevRisk:fixTier(p.prevRisk&&String(p.prevRisk).toLowerCase?p.prevRisk:null)};
  });
  const summary={critical:0,high:0,medium:0,low:0};
  pasal.forEach(function(p){ if(summary[p.risk]!==undefined)summary[p.risk]++; });
  const prof=Object.assign({type:'',parties:'',purpose:'',term:'',value:'Tidak disebutkan',gov:'',disp:'',userPihak:meta.pihak},o.profile||{});
  const fAll=[];
  pasal.forEach(function(p){ p.findings.forEach(function(f){ fAll.push({pasal:p.no,f:f}); }); });

  const orv=String(o.overallRisk||'').trim().toUpperCase();
  const overallRisk=['CRITICAL','HIGH','MEDIUM','LOW'].indexOf(orv)>=0?orv:(summary.critical>0?'CRITICAL':summary.high>0?'HIGH':summary.medium>0?'MEDIUM':'LOW');
  const position=['Favorable','Balanced','Unfavorable'].indexOf(o.position)>=0?o.position:'Balanced';
  const action=String(o.action||'SIGN WITH REVISION');
  let comparison=null;
  if(pasal.some(function(p){return p.status;})){
    comparison={removed:[],changed:pasal.filter(function(p){return ['resolved','partial','worse'].indexOf(p.status)>=0;}).length,
      held:pasal.filter(function(p){return p.status==='hold';}).length,news:pasal.filter(function(p){return p.status==='new';}).length};
  }
  return {engine:'live',profile:prof,
    drafting:(Array.isArray(o.lang)?o.lang:[]).map(function(f){return{type:f.type||'Ambiguitas',issue:String(f.issue||''),quote:String(f.quote||''),sug:String(f.sug||'')};}),
    pasal:pasal,summary:summary,fAll:fAll,
    conflicts:(Array.isArray(o.conflicts)?o.conflicts:[]).map(function(c){return{a:String(c.a||''),b:String(c.b||''),c:String(c.c||''),rk:String(c.rk||''),rec:String(c.rec||'')};}),
    missing:(Array.isArray(o.missing)?o.missing:[]).map(function(m){return{name:String(m.name||''),imp:String(m.imp||'Medium'),why:String(m.why||''),rec:String(m.rec||'')};}),
    stress:(Array.isArray(o.stress)?o.stress:[]).map(function(s){return{k:String(s.k||''),t:String(s.t||''),status:String(s.status||'GAP'),note:String(s.note||'')};}),
    overallRisk:overallRisk,position:position,action:action,actionCls:actionClsOf(action),
    execPoints:(Array.isArray(o.execPoints)?o.execPoints:[]).map(String).slice(0,8),

const TPL_A='PERJANJIAN KERJA SAMA JASA PEMELIHARAAN\nantara PT Verdanco Engineering selaku Pihak Pertama dan PT Mitra Teknik Nusantara selaku Pihak Kedua\nPasal 1 - Ketentuan Umum\nPerjanjian ini akan di laksanakan dengan itikad baik oleh Para Pihak sesuai dengan ketentuan peraturan perundang-undangan yang berlaku di Republik Indonesia.\nPasal 2 - Lingkup Kerja\nPihak Kedua akan memberikan jasa pemeliharaan peralatan kantor milik Pihak Pertama yang meliputi pemeriksaan berkala dan perbaikan ringan. Lingkup pekerjaan tambahan akan disepakati tersendiri secara tertulis.\nPasal 3 - Imbalan Jasa dan Pembayaran\nPihak Pertama wajib membayar imbalan jasa sebesar Rp25.000.000 (dua puluh lima juta rupiah) per bulan. Keterlambatan pembayaran dikenakan denda sebesar 2% per hari dari jumlah yang belum dibayarkan tanpa batas maksimal.\nPasal 4 - Kewajiban Para Pihak\nPihak Pertama wajib menyediakan akses ke lokasi kerja dan data teknis yang diperlukan. Pihak Kedua wajib menyelesaikan pekerjaan sesuai standar mutu yang layak dan memberikan laporan bulanan secara berkala.\nPasal 5 - Jangka Waktu dan Pengakhiran\nPerjanjian ini berlaku selama 12 (dua belas) bulan sejak ditandatangani oleh Para Pihak. Pihak Kedua berhak mengakhiri Perjanjian ini secara sepihak dengan pemberitahuan tertulis 14 hari sebelumnya, sedangkan pengakhiran oleh Pihak Pertama hanya dapat dilakukan apabila Pihak Kedua lalai secara material dan setelah diberi kesempatan untuk memperbaiki dalam jangka waktu yang ditentukan.\nPasal 6 - Ganti Rugi\nPihak Kedua bertanggung jawab atas segala kerugian yang timbul akibat kelalaian Pihak Kedua, dan Para Pihak sepakat bahwa tanggung jawab tersebut mencakup kerugian tidak langsung sepanjang waktu berlakunya Perjanjian ini.\nPasal 7 - Kerahasiaan\nPara Pihak wajib menjaga kerahasiaan seluruh informasi yang dipertukarkan selama waktu yang tidak ditentukan dan/atau sepanjang diperlukan oleh pihak yang menerima informasi tersebut.\nPasal 8 - Hukum yang Berlaku dan Penyelesaian Sengketa\nPerjanjian ini tunduk pada hukum Republik Indonesia. Setiap perselisihan akan diselesaikan secara musyawarah, dan apabila tidak tercapai, Para Pihak sepatutnya menempuh penyelesaian melalui arbitrase.\nPasal 9 - Ketentuan Lain-lain\nHal-hal yang belum diatur dalam Perjanjian ini akan ditetapkan kemudian oleh Para Pihak secara tertulis.';
const TPL_B='MEMORANDUM OF UNDERSTANDING DISTRIBUSI PRODUK\nantara PT Verdanco Indonesia selaku Pihak Pertama dan PT Cahaya Distribusi Utama selaku Pihak Kedua\nPasal 1 - Tujuan Kerja Sama\nPara Pihak sepakat untuk menjalin kerja sama distribusi produk dengan prinsip saling menguntungkan sesuai ketentuan MoU ini.\nPasal 2 - Wilayah dan Eksklusivitas\nPihak Kedua diberikan hak distribusi untuk wilayah Jawa Barat. Selama masa kerja sama, Pihak Kedua dilarang mendistribusikan produk sejenis dari pihak lain tanpa persetujuan tertulis Pihak Pertama.\nPasal 3 - Target Penjualan\nPihak Kedua wajib mencapai target penjualan minimal Rp500.000.000 per kuartal. Kegagalan mencapai target selama dua kuartal berturut-turut dikenakan denda sebesar 5% dari nilai kekurangan target.\nPasal 4 - Pembayaran\nPembayaran dilakukan 30 hari setelah barang diterima oleh Pihak Kedua. Keterlambatan pembayaran oleh Pihak Kedua dikenakan bunga sebesar 2% per bulan.\nPasal 5 - Pengakhiran\nPihak Pertama berhak mengakhiri MoU ini secara sepihak sewaktu-waktu tanpa kompensasi apabila Pihak Kedua dianggap melanggar ketentuan. Pengakhiran oleh Pihak Kedua hanya dapat dilakukan dengan pemberitahuan 90 hari dan tanpa menggugat kerugian apa pun.\nPasal 6 - Ganti Rugi\nPihak Kedua bertanggung jawab atas segala kerugian, tuntutan, dan biaya yang timbul sepanjang waktu berlakunya MoU ini, termasuk kerugian tidak langsung.\nPasal 7 - Kerahasiaan\nInformasi yang dipertukarkan wajib dijaga kerahasiaannya selama waktu yang tidak ditentukan oleh Para Pihak.\nPasal 8 - Penyelesaian Perselisihan\nSetiap perselisihan akan diselesaikan secara musyawarah, dan apabila tidak tercapai, Para Pihak sepatutnya menempuh musyawarah kembali sebelum mengajukan gugatan.\nPasal 9 - Penutup\nMoU ini dibuat dalam rangkap 2 (dua) bermeterai cukup dan berlaku sejak ditandatangani.';
const TPL_C='PERJANJIAN KERAHASIAAN DAN KONSULTANSI\nantara PT Prasetia Qube Wellness selaku Pihak Pertama dan PT Data Cerdas Indonesia selaku Pihak Kedua\nPasal 1 - Ruang Lingkup\nPihak Kedua akan memberikan layanan konsultasi sistem informasi terhadap Pihak Pertama selama 6 (enam) bulan sejak Perjanjian ditandatangani.\nPasal 2 - Kerahasiaan\nPara Pihak wajib menjaga kerahasiaan data dan informasi yang dipertukarkan selama jangka waktu Perjanjian dan 2 (dua) tahun sesudahnya.\nPasal 3 - Imbalan\nPihak Pertama akan membayar imbalan konsultasi sebesar Rp15.000.000 per bulan setelah menerima invoice yang sesuai.\nPasal 4 - Kekayaan Intelektual\nSeluruh hasil kerja yang dihasilkan selama masa konsultasi menjadi milik Pihak Pertama sepenuhnya tanpa kompensasi tambahan.\nPasal 5 - Pengakhiran\nPerjanjian dapat diakhiri oleh Para Pihak dengan pemberitahuan tertulis 30 hari sebelumnya.\nPasal 6 - Ganti Rugi\nGanti rugi hanya berlaku untuk kerugian langsung dan dibatasi maksimal sebesar imbalan 3 (tiga) bulan.\nPasal 7 - Hukum dan Sengketa\nPerjanjian ini tunduk pada hukum Republik Indonesia; perselisihan diselesaikan terlebih dahulu secara musyawarah.\nPasal 8 - Penutup\nPerjanjian ini dibuat dalam rangkap 2 (dua) dan mulai berlaku sejak ditandatangani oleh Para Pihak.';

function evaluateAll(silent){
  let ch=false;
  DB.docs.forEach(function(d){
    if(!d.flags)d.flags={};
    if((d.status==='awaiting_lawyer'||d.status==='returned')&&d.request&&!d.flags.out1&&now()>d.request.sla1){
      d.flags.out1=true; ch=true;
      const law=getUser(d.request.lawyerId), rio=adminForTenant(d.tenant_id);
      if(!silent){ notify(law.id,'OUT OF SLA: '+d.fileName+' telah melewati batas 3 hari kerja.','timer');
        notify(rio.id,'Eskalasi: '+d.fileName+' (reviewer '+d.request.lawyerName+') melewati SLA. Anda dapat reassign atau mengambil alih.','shield-alert');
        emailInternal('OUT OF SLA — '+d.fileName,'Dokumen melewati batas SLA 3 hari kerja tanpa keputusan. Eskalasi ke Managing Partner.',d.request.lawyerName); }
      logAct('timer','Sistem',' mendeteksi Out of SLA (tahap lawyer) pada '+d.fileName);
    }
    if((d.status==='awaiting_lawyer')&&d.request&&!d.flags.r1&&now()>d.request.sla1-864e5){
      d.flags.r1=true; ch=true;
      if(!silent){ const law=getUser(d.request.lawyerId); notify(law.id,'Reminder: sisa waktu SLA '+d.fileName+' ≤ 1 hari kerja.','timer');
        emailInternal('Reminder SLA — '+d.fileName,'Sisa waktu SLA kurang dari 1 hari kerja.',d.request.lawyerName); }
    }
    if(d.status==='awaiting_partner'&&d.stage1&&!d.flags.out2&&now()>d.stage1.sla2){
      d.flags.out2=true; ch=true;
      const rio=DB.users.find(function(u){return u.role==='admin';});
      if(!silent){ notify(rio.id,'OUT OF SLA: konfirmasi Anda atas '+d.fileName+' melewati batas 3 hari kerja.','timer');
        emailInternal('OUT OF SLA (Konfirmasi MP) — '+d.fileName,'Keputusan '+d.stage1.lawyerName+' menunggu konfirmasi Anda dan telah melewati SLA.','Rio Kembara'); }
      logAct('timer','Sistem',' mendeteksi Out of SLA (tahap konfirmasi MP) pada '+d.fileName);
    }
  });
  if(ch)save();
}

async function createWorkspace(){
  const firm=$('#regFirm').value.trim();
  const partner=$('#regPartner').value.trim();
  const email=$('#regEmail').value.trim().toLowerCase();
  const pw=$('#regPw').value;
  const err=$('#regerr');

  if(!firm||!partner||!email||!pw){
    err.textContent='Semua kolom wajib diisi.';
    err.style.display='block';
    return;
  }

  if(pw.length<6){
    err.textContent='Password minimal 6 karakter.';
    err.style.display='block';
    return;
  }

  const existing=await sb.from('users').select('id').eq('email',email).maybeSingle();
  if(existing.data){
    err.textContent='Email sudah terdaftar.';
    err.style.display='block';
    return;
  }

  const btn=$('#regBtn');
  btn.disabled=true;
  btn.textContent='Membuat akun…';

  const tenant={
    id:uid('T'),
    name:firm,
    managingPartner:partner,
    type:'law_firm',
    plan:'trial',
    createdAt:new Date().toISOString()
  };

  const user={
    id:uid('U'),
    tenant_id:tenant.id,
    name:partner,
    email:email,
    pwHash:btoa(pw),
    role:'admin',
    companyId:null,
    partnerOf:[],
    active:true,
    mustChangePw:false,
    title:'Managing Partner',
    createdAt:new Date().toISOString()
  };

  const tRes=await sb.from('tenants').insert(tenant);
  if(tRes.error){
    err.textContent='Tenant gagal dibuat: '+tRes.error.message;
    err.style.display='block';
    btn.disabled=false;
    btn.textContent='Daftar';
    return;
  }

  const uRes=await sb.from('users').insert(user);
  if(uRes.error){
    await sb.from('tenants').delete().eq('id',tenant.id);
    err.textContent='Akun gagal dibuat: '+uRes.error.message;
    err.style.display='block';
    btn.disabled=false;
    btn.textContent='Daftar';
    return;
  }

  DB.tenants=DB.tenants||[];
  DB.tenants.push(tenant);
  DB.users.push(user);

SESS=user;
localStorage.setItem('rara_session',user.id);
TENANT=tenant;
S.view='alldocs';
render();
}

async function processNewDoc(text,meta,comp,nama,fType){
  const live=!!(DB.aiset&&DB.aiset.key);
  let ai=null;
  if(live){
    PROC={mode:'live',i:0,done:false,docId:null,info:{fileName:meta.fileName,pihak:meta.pihak,comp:meta.company,fType:fType},
      steps:[{ic:'send',t:'Mengirim dokumen ke Gemini ('+esc((DB.aiset.model||'gemini-2.0-flash'))+')',s:esc(meta.fileName)+' — system prompt 10 tahap aktif, mohon tunggu (±15–60 detik)…'}]};
    S.view='processing'; render();
    try{ ai=await reviewWithLLM(text,meta,null); }
    catch(e){ toast('Gemini gagal: '+e.message+' — dialihkan ke engine lokal.','err'); }
  }
  if(!ai)ai=reviewDocument(text,meta,null);
  const y=new Date(now()).getFullYear();
  const d={
  id:uid('D'),
  tenant_id:SESS.tenant_id,
  fileName:meta.fileName,userId:SESS.id,userName:nama,companyId:comp.id,pihak:meta.pihak,text:text,createdAt:now(),ai:ai,
    status:'reviewed',parentId:null,version:1,memoNo:'RRG-MEMO/'+y+'/'+pad(++DB.seq.memo),comments:[],flags:{},request:null,stage1:null,stage2:null,history:[]};
  DB.docs.push(d);
  logAct('upload',nama,' mengunggah '+meta.fileName+' ('+meta.pihak+', '+comp.name+')'+(ai.engine==='live'?' [AI Live]':' [lokal]'));
  save();
  PROC={mode:ai.engine,i:-1,done:false,docId:d.id,info:{fileName:meta.fileName,pihak:meta.pihak,comp:meta.company,fType:fType},steps:procStepsFor(ai,meta,fType)};
  if(S.view!=='processing'){ S.view='processing'; render(); }
  const timer=setInterval(function(){
    if(!PROC){ clearInterval(timer); return; }
    if(PROC.i<PROC.steps.length-1){ PROC.i++; updateProcUI(); }
    else{ clearInterval(timer); PROC.i=PROC.steps.length; PROC.done=true; updateProcUI(); }
  },ai.engine==='live'?700:820);
}

function handleRevFile(f){
  if(!f)return;
  if(f.size>10*1024*1024)return toast('Ukuran file melebihi 10 MB.','err');
  if(!/\.(pdf|docx|txt)$/i.test(f.name))return toast('Format harus PDF, DOCX, atau TXT.','err');
  PENDING_REV_FILE=f;
  const el=$('#dz2-name'); el.style.display='block';
  el.innerHTML='<span class="fname">'+esc(f.name)+' · '+(f.size/1024).toFixed(0)+' KB</span>';
}
async function submitRevision(id){
  const parent=DB.docs.find(function(x){return x.id===id;});
  const btn=$('#btn-rev'); if(btn){btn.disabled=true;btn.innerHTML=ic('loader-2')+' Memproses…';}
  try{
    let text, fileName, fType='Dokumen';
    if(PENDING_REV_FILE){
      text=await extractText(PENDING_REV_FILE); fileName=PENDING_REV_FILE.name;
      fType=fileName.toLowerCase().indexOf('.pdf')>=0?'PDF':'DOCX';
    }else{
      text=$('#rev-text').value||'';
      if(text.trim().length<200){ if(btn){btn.disabled=false;btn.innerHTML=ic('sparkles')+' Proses Revisi';} return toast('Pilih file revisi atau tempel teks minimal 200 karakter.','err'); }
      fileName='Revisi_'+parent.fileName; fType='Teks';
    }
    closeModal();
    await processRevisionDoc(parent,text,fileName,fType);
  }catch(err){
    toast(err.message||'Gagal membaca dokumen.','err');
    if(btn){btn.disabled=false;btn.innerHTML=ic('sparkles')+' Proses Revisi';}
  }
}
async function processRevisionDoc(parent,text,fileName,fType){
  const live=!!(DB.aiset&&DB.aiset.key);
  let ai=null;
  if(live){
    PROC={mode:'live',i:0,done:false,docId:null,info:{fileName:fileName,pihak:parent.pihak,comp:companyName(parent),fType:fType},
      steps:[{ic:'send',t:'Mengirim revisi v'+(parent.version+1)+' ke Gemini',s:esc(fileName)+' — konsistensi dengan review sebelumnya dijaga…'}]};
    S.view='processing'; render();
    try{ ai=await reviewWithLLM(text,{pihak:parent.pihak,company:companyName(parent),fileName:fileName},parent.ai); }
    catch(e){ toast('Gemini gagal: '+e.message+' — dialihkan ke engine lokal.','err'); }
  }
  if(!ai)ai=reviewDocument(text,{pihak:parent.pihak,company:companyName(parent),fileName:fileName},parent.ai);
  const y=new Date(now()).getFullYear();
  const d={
  id:uid('D'),
  tenant_id:SESS.tenant_id,
  fileName:fileName,userId:parent.userId,userName:parent.userName,companyId:parent.companyId,
    pihak:parent.pihak,text:text,createdAt:now(),ai:ai,status:'reviewed',parentId:parent.id,version:parent.version+1,
    memoNo:'RRG-MEMO/'+y+'/'+pad(++DB.seq.memo),comments:[],flags:{},request:null,stage1:null,stage2:null,history:[]};
  DB.docs.push(d);
  logAct('refresh-cw',d.userName,' mengunggah revisi v'+d.version+' untuk '+parent.fileName+(ai.engine==='live'?' [AI Live]':' [lokal]'));
  if(parent.request){
    const law=getUser(parent.request.lawyerId);
    notify(law.id,'Revisi v'+d.version+' dari '+d.fileName+' telah diunggah oleh '+d.userName+'.','refresh-cw');
    emailInternal('Revisi Dokumen — '+d.fileName,d.userName+' mengunggah revisi v'+d.version+' yang melanjutkan review sebelumnya.',law.name);
  }
  save();
  PROC={mode:ai.engine,i:-1,done:false,docId:d.id,info:{fileName:fileName,pihak:parent.pihak,comp:companyName(parent),fType:fType},steps:procStepsFor(ai,{pihak:parent.pihak},fType)};
  if(S.view!=='processing'){ S.view='processing'; render(); }
  const timer=setInterval(function(){
    if(!PROC){ clearInterval(timer); return; }
    if(PROC.i<PROC.steps.length-1){ PROC.i++; updateProcUI(); }
    else{ clearInterval(timer); PROC.i=PROC.steps.length; PROC.done=true; updateProcUI(); }
  },ai.engine==='live'?700:820);
}

save();
closeModal();
render();

}

function viewReports(){
  const lawyers=[DB.users.find(function(u){return u.role==='admin';})].concat(DB.users.filter(function(u){return u.role==='lawyer';})).filter(Boolean);
  const stats=lawyers.map(function(l){
    const s1=DB.docs.filter(function(d){return d.stage1&&d.stage1.lawyerId===l.id;});
    const withT=s1.filter(function(d){return d.stage1.decidedAt&&d.request;});
    const avg=withT.length?withT.reduce(function(s,d){return s+(d.stage1.decidedAt-d.request.requestedAt);},0)/withT.length/864e5:0;
    const finals=DB.docs.filter(function(d){return ['approved','approved_notes','rejected'].indexOf(d.status)>=0&&d.stage1&&d.stage1.lawyerId===l.id;});
    const returned=DB.docs.filter(function(d){return d.stage2&&d.stage2.action==='return'&&d.stage1&&d.stage1.lawyerId===l.id;}).length;
    const overridden=DB.docs.filter(function(d){return d.stage2&&d.stage2.action==='override'&&d.stage1&&d.stage1.lawyerId===l.id;}).length;
    return {l:l,handled:s1.length,avg:avg,appr:finals.filter(function(d){return d.status!=='rejected';}).length,rej:finals.filter(function(d){return d.status==='rejected';}).length,returned:returned,overridden:overridden};
  });
  const maxH=Math.max(1,...stats.map(function(s){return s.handled;}));
  const maxA=Math.max(0.1,...stats.map(function(s){return s.avg;}));
  const rioConf=DB.docs.filter(function(d){return d.stage2&&['confirm','return','override'].indexOf(d.stage2.action)>=0;}).length;
  return '<div class="page-head"><div><h2>Laporan Performa</h2><div class="sub">Performa seluruh reviewer — God Hand memiliki visibilitas penuh.</div></div></div>'
  +'<div class="stats">'
  +'<div class="stat"><div class="num">'+DB.docs.length+'</div><div class="lbl">'+ic('file-text')+' Total Dokumen</div></div>'
  +'<div class="stat c-warn"><div class="num">'+DB.docs.filter(function(d){return statusInfo(d).out;}).length+'</div><div class="lbl">'+ic('timer')+' Out of SLA</div></div>'
  +'<div class="stat c-ok"><div class="num">'+DB.docs.filter(function(d){return ['approved','approved_notes'].indexOf(d.status)>=0;}).length+'</div><div class="lbl">'+ic('check-circle-2')+' Approved</div></div>'
  +'<div class="stat c-bad"><div class="num">'+DB.docs.filter(function(d){return d.status==='rejected';}).length+'</div><div class="lbl">'+ic('x-circle')+' Rejected</div></div></div>'
  +'<div class="card"><h3>Dokumen Ditangani</h3><div class="bars">'
  +stats.map(function(s){return '<div class="brow"><div class="bl"><span>'+esc(s.l.name)+' <span style="color:var(--ink3);font-weight:500">· '+roleLabel(s.l)+'</span></span><span>'+s.handled+'</span></div><div class="btrack"><div class="bfill" style="width:'+(s.handled/maxH*100)+'%"></div></div></div>';}).join('')
  +'</div></div>'
  +'<div class="card"><h3>Rata-rata Waktu Keputusan (hari)</h3><div class="bars">'
  +stats.map(function(s){return '<div class="brow '+(s.avg>3?'bad':'')+'"><div class="bl"><span>'+esc(s.l.name)+'</span><span>'+(s.avg?s.avg.toFixed(1)+' hari':'—')+'</span></div><div class="btrack"><div class="bfill" style="width:'+Math.min(100,s.avg/maxA*100)+'%"></div></div></div>';}).join('')
  +'</div><div class="sub" style="margin-top:8px">Merah = melebihi SLA 3 hari kerja.</div></div>'
  +'<div class="card"><h3>Kualitas Keputusan</h3><table class="tbl"><tr><th>Reviewer</th><th>Handled</th><th>Approved</th><th>Rejected</th><th>Dikembalikan Rio</th><th>Di-override Rio</th></tr>'
  +stats.map(function(s){return '<tr><td><b>'+esc(s.l.name)+'</b></td><td>'+s.handled+'</td><td style="color:var(--ok)">'+s.appr+'</td><td style="color:var(--high)">'+s.rej+'</td><td>'+s.returned+'</td><td>'+s.overridden+'</td></tr>';}).join('')
  +'<tr><td><b>Rio Kembara — konfirmasi tahap 2</b></td><td>'+rioConf+'</td><td colspan="4" style="color:var(--ink3)">Keputusan partner yang dikonfirmasi/dikembalikan/di-override</td></tr></table></div>';
}

async function testAI(){

  if(main.length){
    h+='<ol>'+main.map(function(x){const f=x.f;
      return '<li><b>['+TIER_LBL[f.tier]+'] Pasal '+x.pasal+' — '+esc(f.title)+'.</b><br/>Existing: <i>'+esc(f.quote||'—')+'</i><br/>Issue: '+esc(f.finding)+'<br/>Legal Risk: '+esc(f.legalRisk)+'<br/>Consequence (posisi '+esc(d.pihak)+'): '+esc(f.consequence)+'<br/>Recommendation: '+esc(f.recommendation)+'<br/><u>Proposed Wording:</u> '+esc(f.redline)+'</li>';

  h+='<h4>V. CROSS-CLAUSE CONFLICT &amp; MISSING PROVISIONS</h4>';
  if(ai.conflicts.length){ h+='<p><b>Konflik antar-klausul:</b></p><ul>'+ai.conflicts.map(function(c){return '<li>'+esc(c.c)+' — Rekomendasi: '+esc(c.rec)+'</li>';}).join('')+'</ul>'; }

  const negs=[]; const seen={};
  ai.fAll.forEach(function(x){ if(x.f.neg&&!seen[x.f.tag]){seen[x.f.tag]=1;negs.push({pasal:x.pasal,f:x.f});} });

  +'<table class="mmeta"><tr><td>Overall Risk</td><td>'+ai.overallRisk+'</td></tr>'
  +'<tr><td>Position of User</td><td>'+esc(ai.position)+'</td></tr>'
  +'<tr><td>Signing Recommendation</td><td><b>'+esc(ai.action)+'</b></td></tr></table>'

  return h;
}

function printHTML(title,body){
  const html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>'
    +esc(title)+'</title><style>'+PRINT_CSS+'</style></head><body>'
    +body
    +'<script>window.onload=function(){setTimeout(function(){window.focus();window.print();},500);};<\/script>'
    +'</body></html>';

  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');

  if(!w){
    URL.revokeObjectURL(url);
    return toast('Izinkan pop-up browser untuk mencetak atau menyimpan dokumen.','err');
  }

  setTimeout(function(){
    try{ w.focus(); w.print(); }catch(e){}
  },700);

  setTimeout(function(){
    URL.revokeObjectURL(url);
  },60000);
}

    const exists=await sb.from('users').select('id').limit(1);
    if(exists.data&&exists.data.length>0){
      DB=await sbLoad();
      DB.tenants=Array.isArray(DB.tenants)?DB.tenants:[];
DB.users=Array.isArray(DB.users)?DB.users:[];
DB.companies=Array.isArray(DB.companies)?DB.companies:[];
DB.docs=Array.isArray(DB.docs)?DB.docs:[];
DB.notifs=Array.isArray(DB.notifs)?DB.notifs:[];
DB.emails=Array.isArray(DB.emails)?DB.emails:[];
DB.logs=Array.isArray(DB.logs)?DB.logs:[];
      const seqRes=await sb.from('seq').select('*');
      const seqData=(seqRes.data||[]);
      const memoRow=seqData.find(r=>r.key==='memo');
      const simRow=seqData.find(r=>r.key==='simOffset');
      DB.seq={memo:memoRow?memoRow.val:0,apr:0};
      DB.simOffset=simRow?simRow.val:0;
      const aiRes=await sb.from('settings').select('value').eq('key','aiset').single();
      DB.aiset=aiRes.data?aiRes.data.value:{key:'',model:'gemini-2.0-flash'};
    } else {
    DB={
  tenants:[],
  users:[],
  companies:[],
  docs:[],
  notifs:[],
  emails:[],
  logs:[],
  seq:{memo:0,apr:0},
  simOffset:0,
  aiset:{key:'',model:'gemini-2.0-flash'}
};
      S.view='onboard';
      render();
      return;
    }
    if(!SESS){
      const sid=localStorage.getItem('rara_session');
      if(sid){
        const found=(DB.users||[]).find(function(u){
          return u.id===sid&&u.active;
        });
        if(found){
          SESS=found;
          TENANT=(DB.tenants||[]).find(function(t){
            return t.id===found.tenant_id;
          })||null;
          S.view=found.role==='user'?'mydocs':
                 found.role==='lawyer'?'queue':'alldocs';
        }
      }
    }

    render();
  }catch(err){
    document.getElementById('app').innerHTML='<div style="padding:40px;font-family:sans-serif"><b style="color:#B03A2E">Gagal memuat aplikasi:</b> '+esc(err.message)+'<br><br><button onclick="location.reload()" style="padding:10px 18px;background:#6366F1;color:#fff;border:none;border-radius:8px;cursor:pointer">Muat Ulang</button></div>';
  }
}
boot();
setInterval(function(){
  if(!SESS||PROC)return;
  const ae=document.activeElement;
  if(ae&&['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName)>=0)return;
  if(document.querySelector('.modal-ov'))return;
  evaluateAll(); render();
},60000);
setInterval(function(){
  if(!DB)return;
  sbSave();
},30000);
</script>
</body>
</html>
